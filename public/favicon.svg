<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gradBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#080c16" stroke="url(#gradBorder)" stroke-width="3" />

  <!-- Subtle Inner Data Grid Lines -->
  <path d="M12 20h40M12 32h40M12 44h40" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  <path d="M20 12v40M32 12v40M44 12v40" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

  <!-- Data Nodes -->
  <circle cx="20" cy="20" r="2.5" fill="#06b6d4" opacity="0.8" />
  <circle cx="44" cy="20" r="2.5" fill="#6366f1" opacity="0.8" />
  <circle cx="20" cy="44" r="2.5" fill="#6366f1" opacity="0.8" />
  <circle cx="44" cy="44" r="2.5" fill="#06b6d4" opacity="0.8" />

  <!-- CTC Monogram in Center -->
  <text 
    x="32" 
    y="38" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="18" 
    font-weight="900" 
    letter-spacing="0.5"
    fill="url(#gradText)" 
    text-anchor="middle"
    filter="url(#glow)"
  >CTC</text>

  <!-- Glowing Accent Corner Pip -->
  <circle cx="48" cy="14" r="3" fill="#22d3ee" filter="url(#glow)" />
</svg>